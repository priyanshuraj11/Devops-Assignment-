services:
  blue:
    build:
      context: ..
    environment:
      APP_VERSION: v1
    expose:
      - "5004"
    restart: unless-stopped

  green:
    build:
      context: ..
    environment:
      APP_VERSION: v2
    expose:
      - "5004"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue
      - green
    restart: unless-stopped
