apiVersion: v1
kind: Pod
metadata:
  name: lab4-secret-demo
spec:
  containers:
    - name: demo
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          if [ -n "$API_KEY" ]; then
            echo "Kubernetes Secret injected successfully"
          else
            echo "Secret missing"
            exit 1
          fi
          sleep 3600
      env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: lab4-app-secret
              key: API_KEY
